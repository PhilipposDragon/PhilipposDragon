name: README-Stats

on:
  schedule:
    - cron: "43 15 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    name: generate-readme-stats
    permissions:
      contents: write # necessário para commitar docs/*.svg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Sem "npm install": o código está na pasta readme-stats e não tem
      # dependências do npm. Só roda o que está no seu repositório.
      - name: Generate cards
        env:
          # Usa o secret STATS_TOKEN se existir (token pessoal sem escopo "repo");
          # senão usa o GITHUB_TOKEN padrão do Actions.
          PAT_1: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: docs
        run: node readme-stats/generate.mjs

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/stats.svg docs/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "generated readme stats"
          git pull --rebase
          git push
