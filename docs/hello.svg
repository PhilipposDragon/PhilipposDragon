<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font: bold 40px monospace; fill: #3fb950; opacity: 0; }

    /* digitação de cada letra (flash claro -> verde) e permanece visível até o fim do ciclo */
    .l0{animation:k0 6.5s infinite}
    @keyframes k0{0%,6.14%{opacity:0}6.15%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}10%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l1{animation:k1 6.5s infinite}
    @keyframes k1{0%,10.76%{opacity:0}10.77%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}14.62%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l2{animation:k2 6.5s infinite}
    @keyframes k2{0%,13.07%{opacity:0}13.08%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}16.92%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l3{animation:k3 6.5s infinite}
    @keyframes k3{0%,21.53%{opacity:0}21.54%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}25.38%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l4{animation:k4 6.5s infinite}
    @keyframes k4{0%,25.37%{opacity:0}25.38%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}29.23%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l6{animation:k6 6.5s infinite}
    @keyframes k6{0%,38.45%{opacity:0}38.46%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}42.31%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l7{animation:k7 6.5s infinite}
    @keyframes k7{0%,41.53%{opacity:0}41.54%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}45.38%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l8{animation:k8 6.5s infinite}
    @keyframes k8{0%,47.68%{opacity:0}47.69%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}51.54%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l9{animation:k9 6.5s infinite}
    @keyframes k9{0%,50.76%{opacity:0}50.77%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}54.62%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l10{animation:k10 6.5s infinite}
    @keyframes k10{0%,56.91%{opacity:0}56.92%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}60.77%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}
    .l11{animation:k11 6.5s infinite}
    @keyframes k11{0%,66.14%{opacity:0}66.15%{opacity:1;fill:#aff5b4;stroke:#aff5b4;stroke-width:1.5}70%{fill:#3fb950;stroke-width:0}99.9%{opacity:1}100%{opacity:0}}

    /* teclas: caixinha que pisca (flash claro -> verde) e some */
    .kbox { opacity: 0; color: #3fb950; }
    .kbox rect  { fill: none; stroke: currentColor; stroke-width: 2; }
    .kbox path  { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .kbox text  { fill: currentColor; font: bold 13px monospace; text-anchor: middle; }

    /* SP: aparece quando o espaço é digitado (33.85%) e some antes do "W" */
    .sp { animation: sp 6.5s infinite; }
    @keyframes sp {
      0%,33.84% { opacity: 0; }
      33.85%    { opacity: 1; color: #aff5b4; }
      36.5%     { opacity: 1; color: #3fb950; }
      37.7%     { opacity: 1; }
      37.71%,100% { opacity: 0; }
    }

    /* ENTER: aparece no lugar do cursor (74%) e sobe junto com o texto */
    .enter { animation: enterkey 6.5s infinite; }
    @keyframes enterkey {
      0%,73.99% { opacity: 0; }
      74%       { opacity: 1; color: #aff5b4; }
      76%       { color: #3fb950; }
      77.4%     { opacity: 1; }
      77.41%,100% { opacity: 0; }
    }

    /* ENTER: o texto sobe e some (78% -> 86%), depois pausa e reinicia */
    .scroll { animation: scroll 6.5s infinite; }
    @keyframes scroll {
      0%,78%   { transform: translateY(0);     opacity: 1; animation-timing-function: ease-in; }
      86%,100% { transform: translateY(-40px); opacity: 0; }
    }

    .shake { animation: shake 6.5s infinite; }
    @keyframes shake { 0%{transform:translate(0,0)} 6.15%{transform:translate(-1.5px,1.5px)} 6.92%{transform:translate(1px,-0.5px)} 7.69%{transform:translate(0,0)} 10.77%{transform:translate(-1.5px,1.5px)} 11.54%{transform:translate(1px,-0.5px)} 12.31%{transform:translate(0,0)} 13.08%{transform:translate(-1.5px,1.5px)} 13.85%{transform:translate(1px,-0.5px)} 14.62%{transform:translate(0,0)} 21.54%{transform:translate(-1.5px,1.5px)} 22.31%{transform:translate(1px,-0.5px)} 23.08%{transform:translate(0,0)} 25.38%{transform:translate(-1.5px,1.5px)} 26.15%{transform:translate(1px,-0.5px)} 26.92%{transform:translate(0,0)} 33.85%{transform:translate(-1.5px,1.5px)} 34.62%{transform:translate(1px,-0.5px)} 35.38%{transform:translate(0,0)} 38.46%{transform:translate(-1.5px,1.5px)} 39.23%{transform:translate(1px,-0.5px)} 40%{transform:translate(0,0)} 41.54%{transform:translate(-1.5px,1.5px)} 42.31%{transform:translate(1px,-0.5px)} 43.08%{transform:translate(0,0)} 47.69%{transform:translate(-1.5px,1.5px)} 48.46%{transform:translate(1px,-0.5px)} 49.23%{transform:translate(0,0)} 50.77%{transform:translate(-1.5px,1.5px)} 51.54%{transform:translate(1px,-0.5px)} 52.31%{transform:translate(0,0)} 56.92%{transform:translate(-1.5px,1.5px)} 57.69%{transform:translate(1px,-0.5px)} 58.46%{transform:translate(0,0)} 66.15%{transform:translate(-1.5px,1.5px)} 66.92%{transform:translate(1px,-0.5px)} 67.69%{transform:translate(0,0)} 74%{transform:translate(-1.5px,1.5px)} 74.77%{transform:translate(1px,-0.5px)} 75.54%{transform:translate(0,0)} }

    /* cursor avança letra a letra; some enquanto a tecla ENTER aparece (74%-78%)
       e volta para o início da linha quando o texto sobe (78%) */
    .move { animation: move 6.5s step-end infinite, hide 6.5s step-end infinite; }
    @keyframes move { 0%{transform:translateX(0)} 6.15%{transform:translateX(26px)} 10.77%{transform:translateX(52px)} 13.08%{transform:translateX(78px)} 21.54%{transform:translateX(104px)} 25.38%{transform:translateX(130px)} 33.85%{transform:translateX(156px)} 38.46%{transform:translateX(182px)} 41.54%{transform:translateX(208px)} 47.69%{transform:translateX(234px)} 50.77%{transform:translateX(260px)} 56.92%{transform:translateX(286px)} 66.15%{transform:translateX(312px)} 78%,100%{transform:translateX(0)} }
    @keyframes hide { 0%{opacity:1} 74%{opacity:0} 78%,100%{opacity:1} }

    .cursor { fill: #3fb950; animation: blink .7s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g transform="translate(20 0)">
  <g class="shake">
    <!-- texto + teclas: sobem no ENTER -->
    <g class="scroll">
      <text class="t l0" x="30" y="65">H</text>
      <text class="t l1" x="56" y="65">E</text>
      <text class="t l2" x="82" y="65">L</text>
      <text class="t l3" x="108" y="65">L</text>
      <text class="t l4" x="134" y="65">O</text>
      <text class="t l6" x="186" y="65">W</text>
      <text class="t l7" x="212" y="65">O</text>
      <text class="t l8" x="238" y="65">R</text>
      <text class="t l9" x="264" y="65">L</text>
      <text class="t l10" x="290" y="65">D</text>
      <text class="t l11" x="316" y="65">!</text>

      <!-- tecla SP (no lugar do espaço) -->
      <g class="kbox sp" transform="translate(160 0)">
        <rect x="1" y="34" width="24" height="34" rx="3"/>
        <text x="13" y="55">SP</text>
      </g>

      <!-- tecla ENTER (no lugar do cursor, depois do "!") -->
      <g class="kbox enter" transform="translate(342 0)">
        <rect x="1" y="34" width="24" height="34" rx="3"/>
        <path d="M19 45 V54 H8 M12 50 L8 54 L12 58"/>
      </g>
    </g>
    <!-- cursor: fora do grupo que sobe, então fica na "nova linha" -->
    <g class="move">
      <rect class="cursor" x="30" y="27" width="4" height="46"/>
    </g>
  </g>
  </g>
</svg>
