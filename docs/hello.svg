<svg xmlns="http://www.w3.org/2000/svg" width="500" height="110" viewBox="0 0 500 110">
  <defs>
    <clipPath id="reveal">
      <rect x="40" y="20" height="70" width="0">
        <animate attributeName="width" dur="5s" repeatCount="indefinite" calcMode="discrete"
          values="0;24;48;72;96;120;144;168;192;216;240;264;288;312;312;312;312;312;312;312"/>
      </rect>
    </clipPath>
  </defs>

  <text x="40" y="70" font-family="'Courier New', Courier, monospace" font-size="40"
        font-weight="bold" fill="#3fb950" clip-path="url(#reveal)">Hello, World!</text>

  <rect y="30" width="4" height="48" fill="#3fb950">
    <animate attributeName="x" dur="5s" repeatCount="indefinite" calcMode="discrete"
      values="40;64;88;112;136;160;184;208;232;256;280;304;328;352;352;352;352;352;352;352"/>
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete"
      values="1;0"/>
  </rect>
</svg>
