<svg xmlns="http://www.w3.org/2000/svg" width="500" height="110" viewBox="0 0 500 110">

  <style>
    .typing {
      font: bold 40px monospace;
      fill: #3fb950;
    }

    .mask {
      animation: type 8s steps(12) infinite;
    }

    .cursor {
      animation:
        typeCursor 8s steps(12) infinite,
        blink 0.7s infinite;
    }

    .shake {
      animation: keypress 0.67s infinite;
      transform-origin: center;
    }

    @keyframes type {
      from {
        width: 0;
      }
      to {
        width: 290px;
      }
    }

    @keyframes typeCursor {
      from {
        x: 105px;
      }
      to {
        x: 395px;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* Tremida rápida apenas simulando a batida da tecla */
    @keyframes keypress {
      0%, 90%, 100% {
        transform: translate(0, 0);
      }

      91% {
        transform: translate(-2px, 0);
      }

      93% {
        transform: translate(2px, 0);
      }

      95% {
        transform: translate(-1px, 1px);
      }

      97% {
        transform: translate(1px, -1px);
      }

      99% {
        transform: translate(0, 0);
      }
    }
  </style>

  <defs>
    <clipPath id="clip">
      <rect
        class="mask"
        x="105"
        y="15"
        width="0"
        height="80" />
    </clipPath>
  </defs>

  <g class="shake">
    <text
      x="250"
      y="70"
      text-anchor="middle"
      class="typing"
      clip-path="url(#clip)">
      HELLO WORLD!
    </text>
  </g>

  <rect
    class="cursor"
    x="105"
    y="30"
    width="4"
    height="45"
    fill="#3fb950" />

</svg>
