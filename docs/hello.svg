<svg xmlns="http://www.w3.org/2000/svg" width="500" height="110" viewBox="0 0 500 110">

  <style>
    .typing {
      font: bold 40px monospace;
      fill: #3fb950;
    }

    /* Digitação mais lenta */
    .mask {
      animation: type 8s steps(12) infinite;
    }

    .cursor {
      animation:
        typeCursor 8s steps(12) infinite,
        blink .7s infinite;
    }

    /* Pequena tremida quando uma nova letra aparece */
    .shake {
      animation: keypress .67s infinite;
      transform-origin: center;
    }

    @keyframes type {
      from {
        width: 0;
      }
      to {
        width: 315px;
      }
    }

    @keyframes typeCursor {
      from {
        x: 90px;
      }
      to {
        x: 405px;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes keypress {
      0%, 90%, 100% {
        transform: translate(0, 0);
      }

      92% {
        transform: translate(-2px, 0);
      }

      94% {
        transform: translate(2px, 0);
      }

      96% {
        transform: translate(-1px, 1px);
      }

      98% {
        transform: translate(1px, -1px);
      }
    }
  </style>

  <defs>
    <clipPath id="clip">
      <rect
        class="mask"
        x="90"
        y="10"
        width="0"
        height="90" />
    </clipPath>
  </defs>

  <g class="shake">
    <text
      x="250"
      y="70"
      text-anchor="middle"
      class="typing"
      clip-path="url(#clip)">
      HELLO WORLD!
    </text>
  </g>

  <rect
    class="cursor"
    x="90"
    y="28"
    width="4"
    height="48"
    fill="#3fb950" />

</svg>
